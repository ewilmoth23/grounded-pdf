name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_VERSION: "2.13.0"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
      - run: pip install -e "./apps/api[dev]"
      - name: Ruff lint
        working-directory: apps/api
        run: ruff check .
      - name: Ruff format
        working-directory: apps/api
        run: ruff format --check .
      - name: Type check
        working-directory: apps/api
        run: mypy app
      - name: Test
        working-directory: apps/api
        run: pytest --cov=app --cov-report=term-missing
      - name: Migration smoke test
        working-directory: apps/api
        env:
          GROUNDEDPDF_ENVIRONMENT: test
          GROUNDEDPDF_DATABASE_URL: sqlite:////tmp/groundedpdf-migration.db
          GROUNDEDPDF_DATA_DIR: /tmp/groundedpdf-ci
        run: alembic upgrade head
      - name: Schema drift check
        working-directory: apps/api
        env:
          GROUNDEDPDF_ENVIRONMENT: test
          GROUNDEDPDF_DATABASE_URL: sqlite:////tmp/groundedpdf-migration.db
          GROUNDEDPDF_DATA_DIR: /tmp/groundedpdf-ci
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv
      - name: Install CPU PyTorch
        run: .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
      - run: .venv/bin/pip install -e "./apps/api[dev]"
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - name: Upload Playwright traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfiles and Compose
        run: |
          docker build --check ./apps/api
          docker build --check ./apps/web
          docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke-test web and proxied API health
        run: |
          curl --fail --show-error http://127.0.0.1:8080/healthz
          curl --fail --show-error http://127.0.0.1:8080/api/v1/health
          docker compose exec -T web sh -ec 'worker=$(find /usr/share/nginx/html/assets -name "pdf.worker*.mjs" -print -quit); test -n "$worker"; wget -S -O /dev/null "http://127.0.0.1:8080/${worker#/usr/share/nginx/html/}" 2>&1 | grep -qi "content-type: application/javascript"'
          docker compose exec -T api python -c "import os; raise SystemExit(os.geteuid() == 0)"
      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
