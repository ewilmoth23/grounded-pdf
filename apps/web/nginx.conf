server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size __MAX_UPLOAD_BATCH_MB__m;
  error_page 413 = @upload_too_large;

  location @upload_too_large {
    default_type application/json;
    return 413 '{"error":{"code":"upload_batch_too_large","message":"Upload request exceeds the configured batch limit"}}';
  }

  location = /healthz {
    access_log off;
    return 204;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 650s;
    proxy_send_timeout 650s;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # nginx-alpine does not map .mjs consistently. With nosniff enabled, serving
  # the PDF.js module worker as application/octet-stream prevents PDF rendering.
  location ~ \.mjs$ {
    types {
      application/javascript mjs;
    }
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' blob: data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
}
