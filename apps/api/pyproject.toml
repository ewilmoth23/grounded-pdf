[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundedpdf-api"
version = "0.1.0"
description = "Local-first, citation-grounded PDF question answering API"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.13,<2",
  "chromadb>=0.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.12,<1",
  "sentence-transformers>=3,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
ocr = ["pytesseract>=0.3.13,<1", "pillow>=10,<12"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["chromadb.*", "fitz.*", "PIL", "PIL.*", "pytesseract", "sentence_transformers.*"]
ignore_missing_imports = true
